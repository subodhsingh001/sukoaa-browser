<!doctype html><html lang="en" data-platform="android"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-s5noLFHo9LW+nKA8h1R1lJ7rLqr9sBWrHSPTZlez97E='; form-action https://www.google.com https://duckduckgo.com https://www.bing.com; base-uri 'none'"><title>New tab</title><style>*{box-sizing:border-box}html{color-scheme:dark;--bg:#0d151e;--text:#f0f3f7;--muted:#94a4b6;--line:#ffffff14;--surface:#1a2734a6;--accent:#a1e8d1;--highlight:#c0f5e2}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}.wallpaper{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 80% 15%,#395d562e,transparent 55%),radial-gradient(ellipse at 15% 85%,#314e6422,transparent 60%)}.wallpaper svg{position:absolute;right:-7vw;bottom:-16vw;width:90vw;min-width:900px;color:#60897f;opacity:.1;transform:rotate(-12deg)}.topbar{display:flex;justify-content:flex-end;align-items:center;position:absolute;top:32px;left:46px;right:46px;font-size:11px;color:var(--muted)}.wordmark{display:flex;gap:10px;align-items:center;letter-spacing:3px;font-weight:650;color:var(--text)}.icon{width:20px;height:20px;vertical-align:middle;flex-shrink:0}.wordmark .icon{width:25px;height:25px;color:var(--accent)}.date{font-size:11px;letter-spacing:.2px}main{width:min(720px,90vw);margin:auto;padding:clamp(105px,17vh,180px) 0 100px;text-align:center}.greeting{color:var(--muted);font-size:13px;margin-bottom:18px}.clock{font-size:clamp(60px,8vw,92px);font-weight:350;letter-spacing:-4px;line-height:1.05;margin:0 0 24px;font-variant-numeric:tabular-nums}.tagline{font-size:16px;color:var(--text);font-weight:400;margin:0 0 35px;letter-spacing:.1px}.search{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:9px 11px 9px 18px;box-shadow:0 14px 48px #0002;text-align:left;gap:13px;backdrop-filter:blur(18px)}.search:focus-within{border-color:var(--accent)}.search>.icon{color:var(--muted);width:20px}.search input{width:100%;min-width:0;border:0;background:transparent;color:var(--text);padding:13px 0;outline:none;font-size:14px}.search input::placeholder{color:var(--muted)}select{background:transparent;color:var(--muted);border:0;font-size:11px;max-width:95px;cursor:pointer}select option{background:var(--bg);color:var(--text)}.search>button{display:grid;place-items:center;background:var(--accent);color:#143c30;border:0;border-radius:11px;width:40px;height:40px;flex-shrink:0;cursor:pointer}.search>button:hover{background:var(--highlight)}.shortcuts{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:34px 0 0}.shortcut{width:76px;color:var(--text);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:11px;border:0;background:transparent;cursor:pointer;padding:5px;border-radius:10px}.shortcut:hover .shortcut-icon{transform:translateY(-3px);background:var(--surface);border-color:var(--accent)}.shortcut-icon{width:49px;height:49px;background:var(--surface);border:1px solid var(--line);border-radius:15px;display:grid;place-items:center;transition:transform .18s,background .18s;box-shadow:0 6px 20px #0000000a;font-size:18px;font-weight:550;color:var(--accent)}.shortcut-name{max-width:78px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.shortcut .icon{width:21px;height:21px}.shortcut.add .shortcut-icon{background:transparent;border-style:dashed;color:var(--muted)}.bottom{position:fixed;left:44px;right:44px;bottom:25px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}.bottom .icon{width:13px;height:13px;margin-right:6px;color:var(--accent)}kbd{font:10px inherit;border:1px solid var(--line);padding:3px 5px;border-radius:4px;margin:0 3px}.dot{width:5px;height:5px;background:var(--accent);display:inline-block;border-radius:99px;margin-right:8px}dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:28px;width:min(410px,90vw);box-shadow:0 24px 100px #0007}dialog::backdrop{background:#0008;backdrop-filter:blur(5px)}dialog h2{font-size:21px;font-weight:500;margin:0 0 22px;letter-spacing:-.5px}dialog label{font-size:12px;color:var(--muted);display:block;margin:15px 0}dialog input{display:block;margin-top:7px;width:100%;padding:12px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}dialog button{padding:10px 17px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;cursor:pointer}dialog button[type=submit]{background:var(--accent);color:#143c30}.hint{font-size:10px;color:var(--muted);margin-top:24px;line-height:1.7}.message{font-size:12px;color:var(--accent)}@media(prefers-color-scheme:light){html:not([data-platform=android]){color-scheme:light;--bg:#f1f5f3;--text:#20342f;--muted:#6a7e76;--line:#20342f19;--surface:#ffffffb8;--accent:#2c785e;--highlight:#95cfb8}html:not([data-platform=android]) .search>button{color:white}html:not([data-platform=android]) .wallpaper{background:radial-gradient(ellipse at 85% 30%,#c7e0d480,transparent 60%),radial-gradient(ellipse at 5% 90%,#d3e3ee70,transparent 50%)}html:not([data-platform=android]) .search{box-shadow:0 14px 48px #1f4a3520}html:not([data-platform=android]) dialog button[type=submit]{color:white}}@media(max-width:600px){.topbar{top:24px;left:23px;right:23px}.wordmark{font-size:10px;letter-spacing:2px}.date{font-size:10px}.clock{font-size:64px}.tagline{font-size:14px;margin-bottom:25px}main{padding-top:90px;padding-bottom:70px}.greeting{font-size:12px;margin-bottom:13px}.search{gap:9px;padding-left:14px;border-radius:15px}.search input{font-size:13px}.search select{font-size:10px;width:84px;max-width:84px}.shortcuts{gap:8px;margin-top:27px}.shortcut{width:70px}.shortcut-icon{width:45px;height:45px;border-radius:14px}.bottom{position:static;margin:0 23px 20px;justify-content:center}.keyboard,.preview-label{display:none}.wallpaper svg{right:-100vw;bottom:0;min-width:850px}.hint{font-size:9px}dialog{padding:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wallpaper" aria-hidden="true"><svg viewBox="0 0 1200 1200" fill="none" stroke="currentColor" stroke-width="1"><ellipse cx="600" cy="600" rx="120" ry="70"/><ellipse cx="600" cy="600" rx="152" ry="93"/><ellipse cx="600" cy="600" rx="184" ry="116"/><ellipse cx="600" cy="600" rx="216" ry="139"/><ellipse cx="600" cy="600" rx="248" ry="162"/><ellipse cx="600" cy="600" rx="280" ry="185"/><ellipse cx="600" cy="600" rx="312" ry="208"/><ellipse cx="600" cy="600" rx="344" ry="231"/><ellipse cx="600" cy="600" rx="376" ry="254"/><ellipse cx="600" cy="600" rx="408" ry="277"/><ellipse cx="600" cy="600" rx="440" ry="300"/><ellipse cx="600" cy="600" rx="472" ry="323"/><ellipse cx="600" cy="600" rx="504" ry="346"/><ellipse cx="600" cy="600" rx="536" ry="369"/><ellipse cx="600" cy="600" rx="568" ry="392"/><ellipse cx="600" cy="600" rx="600" ry="415"/><ellipse cx="600" cy="600" rx="632" ry="438"/><ellipse cx="600" cy="600" rx="664" ry="461"/></svg></div><div class="topbar"><span id="date" class="date"></span></div><main><div id="greeting" class="greeting">Welcome back.</div><div id="clock" class="clock" aria-label="Local time"></div><h1 class="tagline">A little less noise. A little more focus.</h1><form id="search" class="search" action="https://www.google.com/search"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15ZM16 16l5 5"/></svg><input name="q" type="search" placeholder="Search the web" aria-label="Search the web" required autocomplete="off"><select id="engine" aria-label="Search engine"><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option></select><button type="submit" aria-label="Search"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></form><div id="shortcuts" class="shortcuts" aria-label="Website shortcuts"></div><p class="hint">Make this space yours. Add the websites you visit most.</p></main><footer class="bottom"><span class="keyboard"><kbd>Ctrl</kbd> + <kbd>L</kbd> to search anywhere</span></footer><dialog id="addDialog"><form id="addForm"><h2>A shortcut to your favourite.</h2><label>Name<input id="linkName" maxlength="24" placeholder="e.g. My workspace" required></label><label>Website<input id="linkUrl" placeholder="https://example.com" required inputmode="url"></label><p id="message" class="message" role="status"></p><div class="actions"><button id="cancel" type="button">Cancel</button><button type="submit">Add shortcut</button></div></form></dialog><script>(()=>{const $=id=>document.getElementById(id);function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('date').textContent=now.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});const hour=now.getHours();$('greeting').textContent=hour<12?'Good morning.':hour<18?'Good afternoon.':'Good evening.'}tick();setInterval(tick,30000);const engines={google:'https://www.google.com/search',duckduckgo:'https://duckduckgo.com/',bing:'https://www.bing.com/search'};try{$('engine').value=localStorage.getItem('aegis-home-engine')||'google'}catch{}function engine(){const value=$('engine').value;$('search').action=engines[value]||engines.google;try{localStorage.setItem('aegis-home-engine',value)}catch{}}$('engine').onchange=engine;engine();let custom=[];try{const saved=JSON.parse(localStorage.getItem('aegis-shortcuts')||'[]');if(Array.isArray(saved))custom=saved.filter(x=>typeof x.name==='string'&&typeof x.url==='string'&&x.url.startsWith('https://')).slice(0,6)}catch{}const builtins=[{name:'YouTube',url:'https://www.youtube.com',icon:'youtube'},{name:'Wikipedia',url:'https://en.wikipedia.org',letter:'W'},{name:'GitHub',url:'https://github.com',icon:'code'},{name:'Gmail',url:'https://mail.google.com',icon:'mail'}];const paths={"brand": "M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8", "back": "m15 18-6-6 6-6", "forward": "m9 18 6-6-6-6", "reload": "M20 11a8 8 0 1 0-2.3 6.5M20 4v7h-7", "home": "m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9", "plus": "M12 5v14M5 12h14", "private": "M9 3h6l2 7H7l2-7ZM4 10h16M3 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0ZM15 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0ZM9 17h6", "bookmark": "M6 3h12v18l-6-4-6 4V3Z", "shield": "M12 3 20 6v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Zm-4 9 3 3 5-6", "menu": "M4 6h16M4 12h16M4 18h16", "close": "m6 6 12 12M6 18 18 6", "search": "M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15ZM16 16l5 5", "library": "M4 3h4v18H4V3ZM12 3h4v18h-4V3ZM20 4l3 16", "history": "M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2", "download": "M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5", "appearance": "M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9ZM12 3v18", "lock": "M6 10h12v11H6V10ZM8 10V7a4 4 0 0 1 8 0v3M12 14v3", "link": "M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2", "check": "m5 12 4 4L19 6", "youtube": "M21 8c0-2-1-3-3-3H6C4 5 3 6 3 8v8c0 2 1 3 3 3h12c2 0 3-1 3-3V8ZM10 9l5 3-5 3V9Z", "globe": "M21 12a9 9 0 1 0-18 0 9 9 0 0 0 18 0ZM3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z", "code": "m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16", "mail": "M3 5h18v14H3V5Zm0 0 9 8 9-8"};function save(){try{localStorage.setItem('aegis-shortcuts',JSON.stringify(custom));return true}catch{$('message').textContent='Could not save shortcuts on this device.';return false}}function draw(){$('shortcuts').replaceChildren();for(const [i,item] of [...builtins,...custom].entries()){const link=document.createElement('a');link.href=item.url;link.className='shortcut';link.title=item.url+(i>=builtins.length?' · Right-click or long-press to remove':'');const mark=document.createElement('span');mark.className='shortcut-icon';if(item.icon){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('class','icon');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.7');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',paths[item.icon]);svg.append(p);mark.append(svg)}else mark.textContent=item.letter||item.name.slice(0,1).toUpperCase();const name=document.createElement('span');name.className='shortcut-name';name.textContent=item.name;link.append(mark,name);if(i>=builtins.length)link.oncontextmenu=e=>{e.preventDefault();if(confirm('Remove '+item.name+' from shortcuts?')){custom.splice(i-builtins.length,1);save();draw()}};$('shortcuts').append(link)}if(custom.length<6){const add=document.createElement('button');add.className='shortcut add';add.type='button';const icon=document.createElement('span');icon.className='shortcut-icon';icon.textContent='+';const label=document.createElement('span');label.className='shortcut-name';label.textContent='Add shortcut';add.append(icon,label);add.onclick=()=>{$('addForm').reset();$('message').textContent='';$('addDialog').showModal()};$('shortcuts').append(add)}}draw();$('cancel').onclick=()=>$('addDialog').close();$('addForm').onsubmit=e=>{e.preventDefault();try{let input=$('linkUrl').value.trim();if(!/^https?:/i.test(input))input='https://'+input;const url=new URL(input);if(url.protocol!=='https:'||url.username||url.password)throw Error();custom.push({name:$('linkName').value.trim().slice(0,24),url:url.href});if(save()){$('addDialog').close();draw()}}catch{$('message').textContent='Enter a valid HTTPS website address.'}}})();</script></body></html>
