name: Windows installer build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Download repository source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows installer
        run: npm run dist:windows:internal

      - name: Save installer for download
        uses: actions/upload-artifact@v7
        with:
          name: Sukoaa-Windows-unsigned
          path: build/desktop/*-Setup.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
