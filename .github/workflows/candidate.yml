name: Candidate checks (no public publishing)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npx electron --no-sandbox --ozone-platform=headless ../tests/history-tabs-smoke.cjs
        working-directory: desktop
      - run: npx electron --no-sandbox --ozone-platform=headless ../tests/zoom-smoke.cjs
        working-directory: desktop
      - run: node tools/audit-release.cjs
      - name: Confirm public release is blocked
        run: |
          if node tools/release-gate.cjs; then
            echo 'Gate passed; use the owner-controlled signing workflow for release.'
          else
            echo 'Candidate only: release gate is blocked. This workflow never publishes.'
          fi

      - run: npx electron --no-sandbox --ozone-platform=headless ../tests/site-permissions-smoke.cjs
        working-directory: desktop

      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop
      - run: node tools/check-engines.cjs
      - run: xvfb-run -a desktop/node_modules/electron/dist/electron --no-sandbox tests/tab-experience-smoke.cjs
      - run: xvfb-run -a desktop/node_modules/electron/dist/electron --no-sandbox tests/clipboard-smoke.cjs
      - run: xvfb-run -a desktop/node_modules/electron/dist/electron --no-sandbox tests/repair-lab-smoke.cjs

      - name: Native tab reordering and restart
        env:
          SUKOAA_REORDER_PROFILE: ${{ runner.temp }}/sukoaa-tab-reorder
        run: |
          mkdir -p "$SUKOAA_REORDER_PROFILE"
          xvfb-run -a desktop/node_modules/electron/dist/electron --no-sandbox tests/tab-reorder-smoke.cjs
          SUKOAA_REORDER_RESTORE=1 xvfb-run -a desktop/node_modules/electron/dist/electron --no-sandbox tests/tab-reorder-smoke.cjs

      - name: New-tab focus, playback activation, first-load YouTube policy
        run: xvfb-run -a desktop/node_modules/electron/dist/electron --no-sandbox tests/focus-media-smoke.cjs

      - name: Restored video tabs wait for Play after a real restart
        run: xvfb-run -a node tests/restore-playback-smoke.cjs

      - name: Native editing menus and live tab detachment
        run: xvfb-run -a desktop/node_modules/electron/dist/electron --no-sandbox tests/window-editing-smoke.cjs
      - name: Android external-app URL policy
        run: |
          mkdir -p /tmp/sukoaa-app-policy
          javac -d /tmp/sukoaa-app-policy android/app/src/main/java/com/subo/aegis/ExternalAppPolicy.java tests/ExternalAppPolicyTest.java
          java -cp /tmp/sukoaa-app-policy ExternalAppPolicyTest
